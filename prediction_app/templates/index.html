<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>競馬予想ツール</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<header>
  <h1>🏇 競馬予想ツール</h1>
</header>

<div class="container">

  <!-- フィルター -->
  <div class="filters">
    <div class="filter-group">
      <label for="sel-date">レース日</label>
      <select id="sel-date"><option value="">読み込み中...</option></select>
    </div>
    <div class="filter-group">
      <label for="sel-venue">競馬場</label>
      <select id="sel-venue" disabled><option value="">場を選択</option></select>
    </div>
    <div class="filter-group">
      <label for="sel-race">レース番号</label>
      <select id="sel-race" disabled><option value="">Rを選択</option></select>
    </div>
  </div>

  <!-- レース情報バナー -->
  <div class="race-banner" id="race-banner"></div>

  <!-- AI分析ボタン -->
  <div id="ai-btn-wrap" style="display:none;margin-bottom:.75rem">
    <button id="btn-ai" class="ai-btn">🤖 AI分析</button>
    <span id="ai-cache-hint" class="ai-cache-hint" style="display:none">（キャッシュ済み）</span>
  </div>

  <!-- AI分析カード（テーブルの上） -->
  <div class="ai-card" id="ai-card" style="display:none"></div>

  <!-- バイアス設定パネル -->
  <div class="bias-panel" id="bias-panel" style="display:none">
    <div class="bias-header">馬場バイアス設定</div>
    <div class="bias-form">
      <div class="bias-group">
        <label for="inp-cushion">クッション値</label>
        <input type="number" id="inp-cushion" step="0.1" min="0" max="20" placeholder="例: 9.2">
      </div>
      <div class="bias-group">
        <label for="sel-inner-bias">内外バイアス</label>
        <select id="sel-inner-bias">
          <option value="flat">フラット</option>
          <option value="inner">内有利</option>
          <option value="outer">外有利</option>
        </select>
      </div>
      <div class="bias-group">
        <label for="sel-front-bias">前後バイアス</label>
        <select id="sel-front-bias">
          <option value="flat">フラット</option>
          <option value="front">前有利</option>
          <option value="rear">後有利</option>
        </select>
      </div>
      <div class="bias-note" id="bias-note"></div>
    </div>
  </div>

  <!-- ステータス -->
  <div id="status"></div>

  <!-- テーブル -->
  <div class="table-wrap" id="table-wrap" style="display:none">
    <table>
      <thead>
        <tr>
          <th class="col-num no-sort">馬番</th>
          <th class="col-name no-sort">馬名 <span style="font-size:.68rem;opacity:.7">（クリックで履歴）</span></th>
          <th class="col-run no-sort">脚質</th>
          <th class="col-prob"      data-col="win_prob_pct"   data-dir="desc">推定勝率</th>
          <th class="col-place"     data-col="place_prob_pct" data-dir="desc">複勝率</th>
          <th class="col-adj-ev"    data-col="adjusted_ev"    data-dir="desc">調整後EV</th>
          <th class="col-rec no-sort">推奨</th>
          <th class="col-idx"       data-col="adjusted_index" data-dir="desc">実力指数</th>
          <th class="col-odds"      data-col="odds"           data-dir="asc">単勝オッズ</th>
          <th class="col-place-odds no-sort">複勝オッズ</th>
          <th class="col-ev"        data-col="expected_value" data-dir="desc">期待値</th>
          <th class="col-place-ev"  data-col="place_ev"       data-dir="desc">複勝EV</th>
          <th class="col-rank no-sort">推奨順位</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>

  <!-- 凡例 -->
  <div class="legend" id="legend" style="display:none">
    <div class="legend-item"><div class="legend-dot rec"></div>買い推奨（調整後EV&gt;2.0）</div>
    <div class="legend-item"><div class="legend-dot normal"></div>その他</div>
    <div class="legend-item" style="margin-left:auto;color:#999">列ヘッダークリックで並び替え</div>
  </div>

</div><!-- /container -->

<!-- ── 馬別履歴モーダル ── -->
<div class="modal-overlay" id="modal" style="display:none" role="dialog" aria-modal="true">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title" id="modal-title">過去レース履歴</span>
      <button class="modal-close" id="modal-close" aria-label="閉じる">✕</button>
    </div>
    <div class="modal-body" id="modal-body">
      <p class="loading">読み込み中...</p>
    </div>
  </div>
</div>

<script>
'use strict';

// ── State ──────────────────────────────────────────────
let _horses         = [];   // raw API data
let _cHorses        = [];   // computed (with bias_score, adjusted_ev)
let _sortCol        = 'adjusted_ev';
let _sortDir        = 'desc';
let _currentRaceInfo = null;  // AI分析に渡すレース情報

const BIAS_KEY = 'keiba_bias_settings';
let _bias = { cushion: '', inner: 'flat', front: 'flat' };

// ── DOM refs ───────────────────────────────────────────
const selDate    = document.getElementById('sel-date');
const selVenue   = document.getElementById('sel-venue');
const selRace    = document.getElementById('sel-race');
const banner     = document.getElementById('race-banner');
const status     = document.getElementById('status');
const wrap       = document.getElementById('table-wrap');
const tbody      = document.getElementById('tbody');
const legend     = document.getElementById('legend');
const modal      = document.getElementById('modal');
const modalTitle = document.getElementById('modal-title');
const modalBody  = document.getElementById('modal-body');
const biasPanel  = document.getElementById('bias-panel');
const aiBtnWrap  = document.getElementById('ai-btn-wrap');
const btnAI      = document.getElementById('btn-ai');
const aiCard     = document.getElementById('ai-card');
const aiCacheHint = document.getElementById('ai-cache-hint');
const inpCushion = document.getElementById('inp-cushion');
const selInner   = document.getElementById('sel-inner-bias');
const selFront   = document.getElementById('sel-front-bias');
const biasNote   = document.getElementById('bias-note');

// ── Utilities ──────────────────────────────────────────
async function apiFetch(url) {
  const r = await fetch(url);
  if (!r.ok) {
    const j = await r.json().catch(() => ({}));
    throw new Error(j.detail || `HTTP ${r.status}`);
  }
  return r.json();
}

function setStatus(msg, isError = false) {
  status.textContent = msg;
  status.className   = isError ? 'error' : '';
}

function resetSelect(el, placeholder) {
  el.innerHTML = `<option value="">${placeholder}</option>`;
  el.disabled  = true;
}

function surfaceTag(surf) {
  if (!surf) return '';
  if (surf === '芝')     return `<span class="tag-siba">${surf}</span>`;
  if (surf === 'ダート') return `<span class="tag-dirt">${surf}</span>`;
  return `<span class="tag-jump">${surf}</span>`;
}

// ── Bias settings ───────────────────────────────────────
function loadBiasSettings() {
  try {
    const saved = localStorage.getItem(BIAS_KEY);
    if (saved) _bias = { ..._bias, ...JSON.parse(saved) };
  } catch {}
  inpCushion.value = _bias.cushion || '';
  selInner.value   = _bias.inner   || 'flat';
  selFront.value   = _bias.front   || 'flat';
}

function saveBiasSettings() {
  _bias = { cushion: inpCushion.value, inner: selInner.value, front: selFront.value };
  try { localStorage.setItem(BIAS_KEY, JSON.stringify(_bias)); } catch {}
}

function isBiasActive() {
  return _bias.inner !== 'flat' || _bias.front !== 'flat';
}

function updateBiasNote() {
  const parts = [];
  if (_bias.cushion) parts.push(`クッション値 ${_bias.cushion}`);
  if (_bias.inner !== 'flat') {
    const lbl = _bias.inner === 'inner' ? '内有利（1〜4番 +0.5）' : '外有利（後4頭 +0.5）';
    parts.push(lbl);
  }
  if (_bias.front !== 'flat') {
    const lbl = _bias.front === 'front' ? '前有利（逃・先 +0.5）' : '後有利（差・追 +0.5）';
    parts.push(lbl);
  }
  biasNote.textContent = parts.length ? '適用中: ' + parts.join(' / ') : '';
  biasNote.className   = parts.length ? 'bias-note active' : 'bias-note';
}

// ── Running style ───────────────────────────────────────
function runningStyleLabel(avgCorner) {
  if (avgCorner == null) return null;
  if (avgCorner <= 3.0)  return '逃';
  if (avgCorner <= 5.5)  return '先';
  if (avgCorner <= 8.0)  return '差';
  return '追';
}

const RS_CLASS = { '逃': 'rs-escape', '先': 'rs-lead', '差': 'rs-mid', '追': 'rs-close' };

function fmtRunningStyle(avgCorner) {
  const lbl = runningStyleLabel(avgCorner);
  if (!lbl) return '<span class="rs-null">―</span>';
  return `<span class="running-style ${RS_CLASS[lbl] || ''}">${lbl}</span>`;
}

// ── Bias score ─────────────────────────────────────────
const BIAS_STRENGTH = 0.5;

function computeBiasScore(horse, totalHorses) {
  let score = 0;
  const { inner, front } = _bias;
  const { umaban, avg_corner_pos: ac } = horse;

  if (inner === 'inner' && umaban >= 1 && umaban <= 4)
    score += BIAS_STRENGTH;
  if (inner === 'outer' && umaban >= Math.max(1, totalHorses - 3))
    score += BIAS_STRENGTH;

  if (ac != null) {
    const isFront = ac <= 5.5;
    if (front === 'front' &&  isFront) score += BIAS_STRENGTH;
    if (front === 'rear'  && !isFront) score += BIAS_STRENGTH;
  }

  return score;
}

// ── Compute derived fields ─────────────────────────────
function recomputeHorses() {
  const total = _horses.length;
  _cHorses = _horses.map(h => {
    const bScore = computeBiasScore(h, total);
    const adjEv = (h.expected_value != null) ? h.expected_value + bScore : null;
    return { ...h, bias_score: bScore, adjusted_ev: adjEv };
  });
}

// ── Cell formatters ─────────────────────────────────────
function fmtEv(v) {
  if (v == null) return '<span class="ev-null">―</span>';
  const cls  = v >= 0 ? 'ev-pos' : 'ev-neg';
  const sign = v >= 0 ? '+' : '';
  return `<span class="ev-cell ${cls}">${sign}${v.toFixed(3)}</span>`;
}

function fmtAdjEv(adjEv, bScore) {
  if (adjEv == null) return '<span class="ev-null">―</span>';
  const cls  = adjEv >= 0 ? 'ev-pos' : 'ev-neg';
  const sign = adjEv >= 0 ? '+' : '';
  const tag  = bScore !== 0
    ? `<span class="bias-tag">${bScore > 0 ? '+' : ''}${bScore.toFixed(1)}</span>`
    : '';
  return `<span class="ev-cell ${cls}">${sign}${adjEv.toFixed(3)}</span>${tag}`;
}

function fmtOdds(v) {
  return v != null ? v.toFixed(1) : '―';
}

function fmtProb(v) {
  if (v == null) return '―';
  const bar = Math.min(v / 50 * 100, 100);
  return `<div class="prob-bar-wrap">
    <span class="prob-val">${v.toFixed(1)}%</span>
    <div class="prob-bar-bg"><div class="prob-bar" style="width:${bar}%"></div></div>
  </div>`;
}

function fmtPlace(v) {
  if (v == null) return '―';
  const bar = Math.min(v / 95 * 100, 100);
  return `<div class="prob-bar-wrap">
    <span class="prob-val">${v.toFixed(1)}%</span>
    <div class="prob-bar-bg"><div class="place-bar" style="width:${bar}%"></div></div>
  </div>`;
}

function fmtIdx(v) { return v != null ? v.toFixed(1) : '―'; }

function fmtPlaceOdds(lo, hi) {
  if (lo == null) return '<span class="ev-null">―</span>';
  if (hi == null || lo === hi) return lo.toFixed(1);
  return `${lo.toFixed(1)}<span style="color:#aaa">~</span>${hi.toFixed(1)}`;
}

function fmtPerf(v) {
  if (v == null) return '―';
  const cls  = v >= 0 ? 'perf-pos' : 'perf-neg';
  const sign = v >= 0 ? '+' : '';
  return `<span class="${cls}">${sign}${v.toFixed(4)}</span>`;
}

function fmtPos(v) {
  if (!v) return '―';
  const cls = v === 1 ? 'pos-1' : v === 2 ? 'pos-2' : v === 3 ? 'pos-3' : '';
  return `<span class="${cls}">${v}着</span>`;
}

// ── Sort ───────────────────────────────────────────────
function sortHorses(col, dir) {
  _cHorses = [..._cHorses].sort((a, b) => {
    const av = a[col] ?? (dir === 'desc' ? -Infinity : Infinity);
    const bv = b[col] ?? (dir === 'desc' ? -Infinity : Infinity);
    return dir === 'desc' ? bv - av : av - bv;
  });
}

function applySort(col) {
  _sortDir = (_sortCol === col && _sortDir === 'desc') ? 'asc' : 'desc';
  _sortCol = col;
  sortHorses(_sortCol, _sortDir);
  updateSortHeaders();
  renderTable();
}

function updateSortHeaders() {
  document.querySelectorAll('thead th[data-col]').forEach(th => {
    th.classList.remove('sort-asc', 'sort-desc');
    if (th.dataset.col === _sortCol)
      th.classList.add(_sortDir === 'desc' ? 'sort-desc' : 'sort-asc');
  });
}

// ── Render main table ──────────────────────────────────
function renderTable() {
  if (!_cHorses.length) {
    tbody.innerHTML = '<tr><td colspan="13" class="empty">データがありません</td></tr>';
    return;
  }

  // 調整後EV順の推奨順位を算出
  const rankMap = {};
  [..._cHorses]
    .filter(h => h.adjusted_ev != null)
    .sort((a, b) => b.adjusted_ev - a.adjusted_ev)
    .forEach((h, i) => { rankMap[h.umaban] = i + 1; });

  const biasActive = isBiasActive();

  tbody.innerHTML = _cHorses.map(h => {
    const isRec     = biasActive
      ? (h.adjusted_ev != null && h.adjusted_ev >= 2.0)
      : h.is_recommended;
    const recClass  = isRec ? 'recommended' : '';
    const badge     = isRec
      ? '<span class="badge-rec">✔</span>'
      : '<span class="badge-no-rec">―</span>';
    const rank      = rankMap[h.umaban];
    const rankCell  = rank != null
      ? `<span class="rank-badge rank-${Math.min(rank, 5)}">${rank}位</span>`
      : '―';
    const nameCell  = h.kettonum
      ? `<span class="horse-link" data-kettonum="${h.kettonum}" data-bamei="${h.bamei}">${h.bamei}</span>`
      : h.bamei;

    return `<tr class="${recClass}">
      <td><span class="umaban">${h.umaban}</span></td>
      <td class="col-name">${nameCell}</td>
      <td>${fmtRunningStyle(h.avg_corner_pos)}</td>
      <td>${fmtProb(h.win_prob_pct)}</td>
      <td>${fmtPlace(h.place_prob_pct)}</td>
      <td>${fmtAdjEv(h.adjusted_ev, h.bias_score)}</td>
      <td>${badge}</td>
      <td>${fmtIdx(h.adjusted_index)}</td>
      <td>${fmtOdds(h.odds)}</td>
      <td>${fmtPlaceOdds(h.place_odds_min, h.place_odds_max)}</td>
      <td>${fmtEv(h.expected_value)}</td>
      <td>${fmtEv(h.place_ev)}</td>
      <td>${rankCell}</td>
    </tr>`;
  }).join('');
}

// ── Bias change handler ────────────────────────────────
function onBiasChange() {
  saveBiasSettings();
  updateBiasNote();
  if (_horses.length) {
    recomputeHorses();
    sortHorses(_sortCol, _sortDir);
    renderTable();
  }
}

// ── API: load selects ───────────────────────────────────
async function loadDates() {
  setStatus('日付を読み込み中...');
  try {
    const dates = await apiFetch('/api/dates');
    selDate.innerHTML = '<option value="">日付を選択</option>' +
      dates.map(d => `<option value="${d.value}">${d.label}</option>`).join('');
    selDate.disabled = false;
    setStatus('');
  } catch (e) {
    setStatus(`日付の読み込みに失敗: ${e.message}`, true);
  }
}

async function loadVenues(date) {
  resetSelect(selVenue, '読み込み中...');
  resetSelect(selRace, 'Rを選択');
  try {
    const venues = await apiFetch(`/api/venues?date=${date}`);
    selVenue.innerHTML = '<option value="">競馬場を選択</option>' +
      venues.map(v => `<option value="${v.code}">${v.name}</option>`).join('');
    selVenue.disabled = venues.length === 0;
    if (venues.length === 1) {
      selVenue.value = venues[0].code;
      await loadRaces(date, venues[0].code);
    }
  } catch (e) {
    setStatus(`競馬場の読み込みに失敗: ${e.message}`, true);
  }
}

async function loadRaces(date, venue) {
  resetSelect(selRace, '読み込み中...');
  try {
    const races = await apiFetch(`/api/race_list?date=${date}&venue=${venue}`);
    selRace.innerHTML = '<option value="">レースを選択</option>' +
      races.map(r => {
        const surf = r.surface || '';
        const dist = r.distance ? `${r.distance}m` : '';
        return `<option value="${r.racenum}">第${r.racenum}R ${surf}${dist}</option>`;
      }).join('');
    selRace.disabled = races.length === 0;
    if (races.length === 1) {
      selRace.value = String(races[0].racenum);
      await loadPrediction(date, venue, races[0].racenum);
    }
  } catch (e) {
    setStatus(`レース一覧の読み込みに失敗: ${e.message}`, true);
  }
}

function resetAICard() {
  aiBtnWrap.style.display  = 'none';
  aiCard.style.display     = 'none';
  aiCard.innerHTML         = '';
  aiCacheHint.style.display = 'none';
  _currentRaceInfo = null;
}

async function loadPrediction(date, venue, race) {
  setStatus('読み込み中...');
  wrap.style.display   = 'none';
  legend.style.display = 'none';
  biasPanel.style.display = 'none';
  banner.classList.remove('visible');
  resetAICard();
  _horses = [];

  try {
    const data = await apiFetch(`/api/prediction?date=${date}&venue=${venue}&race=${race}`);
    const info = data.race_info;

    const namePart = info.race_name ? ` 【${info.race_name}】` : '';
    const surfPart = info.surface || info.distance
      ? `　${info.surface}${info.distance ? info.distance + 'm' : ''}`
      : '';
    banner.innerHTML =
      `<strong>${info.date}　${info.venue}　第${info.race_num}R</strong>${namePart}${surfPart}` +
      `　<span style="color:#888;font-size:.82rem">${data.horses.length}頭</span>`;
    banner.classList.add('visible');

    _horses  = data.horses;
    recomputeHorses();
    _sortCol = 'adjusted_ev';
    _sortDir = 'desc';
    sortHorses(_sortCol, _sortDir);
    updateSortHeaders();
    renderTable();

    _currentRaceInfo = {
      date: info.date, venue: info.venue, race_num: info.race_num,
      race_name: info.race_name || '', surface: info.surface || '',
      distance: info.distance || 0,
    };
    aiBtnWrap.style.display  = '';
    biasPanel.style.display  = '';
    wrap.style.display       = '';
    legend.style.display     = 'flex';
    updateBiasNote();
    setStatus('');
  } catch (e) {
    setStatus(e.message.includes('見つかりません')
      ? 'このレースの予想データがありません。'
      : `エラー: ${e.message}`, true);
  }
}

// ── Horse history modal ────────────────────────────────
async function showHorseHistory(kettonum, bamei) {
  modalTitle.textContent = `${bamei}　過去レース履歴`;
  modalBody.innerHTML    = '<p class="loading">読み込み中...</p>';
  modal.style.display    = 'flex';
  document.body.style.overflow = 'hidden';

  try {
    const data = await apiFetch(`/api/horse_history?kettonum=${encodeURIComponent(kettonum)}`);
    if (!data.races.length) {
      modalBody.innerHTML = '<p class="loading">過去レースデータがありません。</p>';
      return;
    }

    const rows = data.races.map(r => {
      const distPart  = r.distance ? `${r.distance}m` : '';
      const raceLabel = r.race_name
        ? `<span style="color:#555">${r.race_name}</span>`
        : `第${r.race_num}R`;
      return `<tr>
        <td class="left">${r.date}</td>
        <td>${r.venue}</td>
        <td>${raceLabel}</td>
        <td>${surfaceTag(r.surface)}${distPart}</td>
        <td>${fmtPos(r.finish_pos)}</td>
        <td>${fmtPerf(r.perf_index)}</td>
        <td>${r.norm_index != null ? r.norm_index.toFixed(1) : '―'}</td>
      </tr>`;
    }).join('');

    modalBody.innerHTML = `
      <table class="history-table">
        <thead>
          <tr>
            <th class="left">日付</th>
            <th>競馬場</th>
            <th>レース</th>
            <th>馬場・距離</th>
            <th>着順</th>
            <th>perf_index</th>
            <th>norm_index</th>
          </tr>
        </thead>
        <tbody>${rows}</tbody>
      </table>`;
  } catch (e) {
    modalBody.innerHTML = `<p class="loading" style="color:#c0392b">エラー: ${e.message}</p>`;
  }
}

function closeModal() {
  modal.style.display = 'none';
  document.body.style.overflow = '';
}

// ── AI分析 ─────────────────────────────────────────────

function renderAIText(text) {
  // シンプルなMarkdown→HTML変換（外部ライブラリ不要）
  let html = '';
  const lines = text.split('\n');
  let inList = false;

  for (let i = 0; i < lines.length; i++) {
    let line = lines[i];

    // **bold**
    line = line.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');

    // ## セクション見出し
    if (/^## (.+)/.test(line)) {
      if (inList) { html += '</ul>'; inList = false; }
      html += `<h3 class="ai-section-title">${line.replace(/^## /, '')}</h3>`;
      continue;
    }

    // 箇条書き（-/・）
    if (/^[-・]\s/.test(line)) {
      if (!inList) { html += '<ul class="ai-list">'; inList = true; }
      html += `<li>${line.replace(/^[-・]\s/, '')}</li>`;
      continue;
    }

    if (inList) { html += '</ul>'; inList = false; }

    // 空行
    if (!line.trim()) {
      html += '<br>';
      continue;
    }

    // ◎○▲ に色付け
    line = line
      .replace(/(◎\s*\S+)/g, '<span class="ai-rec-circle">$1</span>')
      .replace(/(○\s*\S+)/g,  '<span class="ai-rec-maru">$1</span>')
      .replace(/(▲\s*\S+)/g,  '<span class="ai-rec-sankaku">$1</span>');

    html += `<p class="ai-line">${line}</p>`;
  }
  if (inList) html += '</ul>';
  return html;
}

async function requestAIAnalysis() {
  if (!_currentRaceInfo) return;

  btnAI.disabled = true;
  aiCard.style.display = '';
  aiCard.innerHTML = '<div class="ai-loading"><span class="ai-spinner"></span> AI分析中...</div>';
  aiCacheHint.style.display = 'none';

  const payload = {
    race_info: _currentRaceInfo,
    horses: _cHorses.map(h => ({
      umaban:         h.umaban,
      bamei:          h.bamei,
      avg_corner_pos: h.avg_corner_pos ?? null,
      adjusted_index: h.adjusted_index ?? null,
      win_prob_pct:   h.win_prob_pct   ?? null,
      place_prob_pct: h.place_prob_pct ?? null,
      odds:           h.odds           ?? null,
      expected_value:  h.expected_value  ?? null,
      adjusted_ev:     h.adjusted_ev     ?? null,
      place_odds_min:  h.place_odds_min  ?? null,
      place_odds_max:  h.place_odds_max  ?? null,
      place_ev:        h.place_ev        ?? null,
      bias_score:      h.bias_score      ?? 0,
    })),
    bias: _bias,
  };

  try {
    const res = await fetch('/api/ai_analysis', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
    });

    if (!res.ok) {
      const j = await res.json().catch(() => ({}));
      aiCard.innerHTML = `<div class="ai-error">AI分析エラー: ${j.detail || res.status}</div>`;
      return;
    }

    const isCache = res.headers.get('X-Cache') === 'HIT';
    const reader  = res.body.getReader();
    const dec     = new TextDecoder();
    let accumulated = '';
    let buf = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      const parts = buf.split('\n\n');
      buf = parts.pop();        // 未完了のチャンクを保持
      for (const part of parts) {
        if (!part.startsWith('data: ')) continue;
        let data;
        try { data = JSON.parse(part.slice(6)); } catch { continue; }
        if (data.error) {
          aiCard.innerHTML = `<div class="ai-error">エラー: ${data.error}</div>`;
          return;
        }
        if (data.text) {
          accumulated += data.text;
          aiCard.innerHTML = `<div class="ai-content">${renderAIText(accumulated)}</div>`;
        }
      }
    }

    if (isCache) aiCacheHint.style.display = '';
  } catch (e) {
    aiCard.innerHTML = `<div class="ai-error">通信エラー: ${e.message}</div>`;
  } finally {
    btnAI.disabled = false;
  }
}
